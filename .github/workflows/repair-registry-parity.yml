name: One-shot registry parity repair

on:
  push:
    branches:
      - repair/item1-s1-s6
    paths:
      - .github/workflows/repair-registry-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/item1-s1-s6
          fetch-depth: 0

      - name: Patch registry and checker with guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('src/domain/atomRegistry.json')
          registry = json.loads(registry_path.read_text())
          targets = [a for a in registry['atoms'] if a['id'] == 'atom.developChromatogram.develop-strip']
          if len(targets) != 1:
              raise SystemExit(f'Expected exactly one development atom, found {len(targets)}')
          atom = targets[0]
          if atom['allowedInteractionTypes'] != ['snapIntoTarget']:
              raise SystemExit(f'Unexpected pre-patch interaction types: {atom["allowedInteractionTypes"]!r}')
          atom['allowedInteractionTypes'] = ['snapIntoTarget', 'recordNotebook']
          expected_evidence = 'developed chromatogram with a marked solvent front'
          if atom['evidence'] != expected_evidence:
              raise SystemExit(f'Unexpected pre-patch evidence text: {atom["evidence"]!r}')
          atom['evidence'] = 'developed chromatogram ready for removal and prompt solvent-front marking'
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')

          checker_path = Path('scripts/checkContentConsistency.mjs')
          checker = checker_path.read_text()
          old_typed = '''const TYPED_ATOM_INTERACTION_EFFECT_CLASSES = {\n  "atom.observe.set-active-photometer-wavelength": {\n    readInstrument: ["apparatus-material-instrument-state", "evidence-recording"],\n  },\n};'''
          new_typed = '''const TYPED_ATOM_INTERACTION_EFFECT_CLASSES = {\n  "atom.observe.set-active-photometer-wavelength": {\n    readInstrument: ["apparatus-material-instrument-state", "evidence-recording"],\n  },\n  "atom.developChromatogram.develop-strip": {\n    recordNotebook: ["apparatus-material-instrument-state"],\n  },\n};'''
          if checker.count(old_typed) != 1:
              raise SystemExit(f'Expected one typed-effect block, found {checker.count(old_typed)}')
          checker = checker.replace(old_typed, new_typed)

          old_compat = '  recordNotebook: ["calculate", "record", "observe", "stressEquilibrium", "mix", "vent", "settle", "dry", "cool", "transfer", "rinse"],'
          new_compat = '  recordNotebook: ["calculate", "record", "observe", "stressEquilibrium", "mix", "vent", "settle", "dry", "cool", "transfer", "rinse", "developChromatogram"],'
          if checker.count(old_compat) != 1:
              raise SystemExit(f'Expected one recordNotebook compatibility mirror, found {checker.count(old_compat)}')
          checker = checker.replace(old_compat, new_compat)
          checker_path.write_text(checker)
          PY

          git diff --check

      - name: Commit repaired source-of-truth parity and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/atomRegistry.json scripts/checkContentConsistency.mjs
          git rm .github/workflows/repair-registry-parity.yml
          git commit -m "Synchronize chromatography registry source of truth"
          git push origin HEAD:repair/item1-s1-s6
