name: One-shot chromatography interaction finalizer

on:
  push:
    branches:
      - repair/item1-s1-s6
    paths:
      - .github/workflows/finalize-chromatography-interaction.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/item1-s1-s6
          fetch-depth: 0

      - name: Remove obsolete development snap interaction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('src/domain/atomRegistry.json')
          registry = json.loads(registry_path.read_text())
          targets = [a for a in registry['atoms'] if a['id'] == 'atom.developChromatogram.develop-strip']
          if len(targets) != 1:
              raise SystemExit(f'Expected one development atom, found {len(targets)}')
          atom = targets[0]
          expected = ['snapIntoTarget', 'recordNotebook']
          if atom['allowedInteractionTypes'] != expected:
              raise SystemExit(f'Unexpected interaction types: {atom["allowedInteractionTypes"]!r}')
          atom['allowedInteractionTypes'] = ['recordNotebook']
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')

          checker_path = Path('scripts/checkContentConsistency.mjs')
          checker = checker_path.read_text()
          old = '  snapIntoTarget: ["place", "developChromatogram"],'
          new = '  snapIntoTarget: ["place"],'
          if checker.count(old) != 1:
              raise SystemExit(f'Expected one stale snap mirror, found {checker.count(old)}')
          checker = checker.replace(old, new)
          checker_path.write_text(checker)
          PY
          git diff --check

      - name: Commit final interaction parity and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/atomRegistry.json scripts/checkContentConsistency.mjs
          git rm .github/workflows/finalize-chromatography-interaction.yml
          git commit -m "Finalize chromatography development interaction parity"
          git push origin HEAD:repair/item1-s1-s6
