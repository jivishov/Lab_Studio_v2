name: One-shot interactions diff cleanup

on:
  push:
    branches:
      - repair/item1-s1-s6
    paths:
      - .github/workflows/repair-interactions-diff.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/item1-s1-s6
          fetch-depth: 0

      - name: Restore baseline line endings with only intended semantic changes
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          baseline = 'f5ea3039b9968a0826c3a017bf0330f7f96b250c'
          data = subprocess.check_output(['git', 'show', f'{baseline}:src/domain/interactions.ts'])
          if b'\r\n' not in data:
              raise SystemExit('Expected CRLF baseline for interactions.ts')

          old = b'  snapIntoTarget: ["place", "developChromatogram"],\r\n'
          new = (
              b'  // Chromatography insertion is a distinct `place` action. Development itself is the\r\n'
              b'  // stateful process control performed only after the strip is already seated and the lid closed.\r\n'
              b'  snapIntoTarget: ["place"],\r\n'
          )
          if data.count(old) != 1:
              raise SystemExit(f'Unexpected snap compatibility count: {data.count(old)}')
          data = data.replace(old, new)

          old = b'  recordNotebook: ["calculate", "record", "observe", "stressEquilibrium", "mix", "vent", "settle", "dry", "cool", "transfer", "rinse"],\r\n'
          new = b'  recordNotebook: ["calculate", "record", "observe", "stressEquilibrium", "mix", "vent", "settle", "dry", "cool", "transfer", "rinse", "developChromatogram"],\r\n'
          if data.count(old) != 1:
              raise SystemExit(f'Unexpected recordNotebook compatibility count: {data.count(old)}')
          data = data.replace(old, new)

          old = (
              b'  if (action.verb === "developChromatogram") {\r\n'
              b'    return withCommonCues(action, {\r\n'
              b'      type: "snapIntoTarget",\r\n'
              b'      sourceDefinitionId,\r\n'
              b'      targetDefinitionId,\r\n'
              b'      snapZoneId,\r\n'
              b'      accessibleLabel: `Place ${definiteEquipmentLabel(equipmentLabel(sourceDefinitionId, "the spotted chromatography paper"))} into ${definiteEquipmentLabel(equipmentLabel(targetDefinitionId, "the chromatography chamber"))}.`,\r\n'
              b'    });\r\n'
              b'  }\r\n'
          )
          new = (
              b'  if (action.verb === "developChromatogram") {\r\n'
              b'    return withCommonCues(action, {\r\n'
              b'      type: "recordNotebook",\r\n'
              b'      valueParameter: "note",\r\n'
              b'      accessibleLabel: `Develop the already inserted strip under the closed-chamber conditions for ${action.label}.`,\r\n'
              b'    });\r\n'
              b'  }\r\n'
          )
          if data.count(old) != 1:
              raise SystemExit(f'Unexpected default development interaction count: {data.count(old)}')
          data = data.replace(old, new)

          Path('src/domain/interactions.ts').write_bytes(data)
          PY
          git diff --check

      - name: Commit minimal interactions diff and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/interactions.ts
          git rm .github/workflows/repair-interactions-diff.yml
          git commit -m "Minimize chromatography interaction diff"
          git push origin HEAD:repair/item1-s1-s6
